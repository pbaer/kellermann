<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kellermann Proofreader</title>
<style>
  * { box-sizing: border-box; }
  :root { --bar-h: 40px; --accent: #c9a86a; --ink: #2a2520; }
  html, body { margin: 0; height: 100vh; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    font-family: Georgia, "Times New Roman", serif;
    background: var(--ink);
    color: #f4f1ea;
  }

  /* Top toggle bar */
  #bar {
    flex: 0 0 var(--bar-h);
    display: flex;
    align-items: stretch;
    background: var(--ink);
    border-bottom: 3px solid #8a6a3a;
    padding: 0 12px;
    gap: 14px;
    user-select: none;
  }
  #bar .brand {
    display: flex;
    align-items: center;
    font-size: 0.82rem;
    letter-spacing: 0.06em;
    color: #8a7a5a;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #tabs { display: flex; align-items: stretch; gap: 0; }
  #tabs button {
    appearance: none;
    background: transparent;
    border: none;
    color: #b8a888;
    font-family: inherit;
    font-size: 0.92rem;
    letter-spacing: 0.03em;
    padding: 0 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
  }
  #tabs button:hover { color: #f4f1ea; background: rgba(255, 255, 255, 0.05); }
  /* Active tab: a subtle warm shade fills the segment rather than an underline. */
  #tabs button.active {
    color: var(--accent);
    background: rgba(201, 168, 106, 0.16);
    font-weight: bold;
  }
  #tabs button.active:hover { background: rgba(201, 168, 106, 0.2); }
  #tabs button .icon { font-size: 1rem; line-height: 1; }
  /* Unsaved-changes dot — shown per tab whenever that tool is dirty, so an
     uncommitted edit you left behind in the other mode stays visible. */
  #tabs button .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #d98a4a;
    box-shadow: 0 0 0 2px rgba(217, 138, 74, 0.3);
    flex: 0 0 auto;
  }
  #tabs button .dot[hidden] { display: none; }
  #bar .hint {
    margin-left: auto;
    display: flex;
    align-items: center;
    font-size: 0.7rem;
    font-style: italic;
    color: #6a5a3a;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  #bar .hint kbd {
    font-family: "Courier New", Courier, monospace;
    font-style: normal;
    background: #3a322a;
    color: #c9a86a;
    border-radius: 3px;
    padding: 1px 5px;
    margin: 0 2px;
    font-size: 0.68rem;
  }

  /* Frame stack — both tools stay mounted; the inactive one is hidden but keeps
     its layout box (so map-fit / scroll centering measure correctly) and all of
     its in-page state. */
  #frames { flex: 1 1 auto; position: relative; min-height: 0; background: #f4f1ea; }
  #frames iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  #frames iframe.inactive {
    visibility: hidden;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="bar">
    <span class="brand">Kellermann</span>
    <div id="tabs">
      <button id="tab-letters" data-tab="letters">
        <span class="icon">✉️</span><span>Letters</span>
        <span class="dot" id="dot-letters" hidden title="Uncommitted changes"></span>
      </button>
      <button id="tab-audio" data-tab="audio">
        <span class="icon">🎧</span><span>Audio</span>
        <span class="dot" id="dot-audio" hidden title="Uncommitted changes"></span>
      </button>
    </div>
    <span class="hint">Switch&nbsp;<kbd>Alt</kbd>+<kbd>1</kbd>/<kbd>2</kbd></span>
  </div>
  <div id="frames">
    <iframe id="frame-letters" title="Kriegstagebuch letters"></iframe>
    <iframe id="frame-audio" title="Audio transcript"></iframe>
  </div>

<script>
(() => {
  const TAB_KEY = "combined.tab";
  const HASH_KEY = tab => `combined.${tab}Hash`;
  const TABS = ["letters", "audio"];

  const frames = {
    letters: document.getElementById("frame-letters"),
    audio: document.getElementById("frame-audio"),
  };
  const tabBtns = {
    letters: document.getElementById("tab-letters"),
    audio: document.getElementById("tab-audio"),
  };
  const dots = {
    letters: document.getElementById("dot-letters"),
    audio: document.getElementById("dot-audio"),
  };

  let active = localStorage.getItem(TAB_KEY);
  if (!TABS.includes(active)) active = "letters";

  // Mount both tools eagerly so switching is instant and state persists from
  // the start. Restore each tool's last-opened item from its remembered hash.
  for (const tab of TABS) {
    const savedHash = localStorage.getItem(HASH_KEY(tab)) || "";
    frames[tab].src = `/tool/${tab}` + savedHash;
  }

  function pauseAudioFrame() {
    try {
      const a = frames.audio.contentWindow.document.getElementById("audio");
      if (a && !a.paused) a.pause();
    } catch (_) { /* not loaded yet / cross-origin guard */ }
  }

  function setActive(tab, { focus = true } = {}) {
    if (!TABS.includes(tab)) return;
    active = tab;
    localStorage.setItem(TAB_KEY, tab);
    for (const t of TABS) {
      frames[t].classList.toggle("inactive", t !== tab);
      tabBtns[t].classList.toggle("active", t === tab);
    }
    // Don't let audio keep playing under a hidden frame.
    if (tab !== "audio") pauseAudioFrame();
    if (focus) {
      try { frames[tab].contentWindow.focus(); } catch (_) {}
    }
  }

  for (const tab of TABS) {
    tabBtns[tab].addEventListener("click", () => setActive(tab));
  }

  // Alt+1 / Alt+2 to switch. Inject the same shortcut into each tool's document
  // so it works no matter which frame currently holds keyboard focus, without
  // editing the tools themselves.
  function handleSwitchKey(e) {
    if (!e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "1") { e.preventDefault(); setActive("letters"); }
    else if (e.key === "2") { e.preventDefault(); setActive("audio"); }
  }
  window.addEventListener("keydown", handleSwitchKey);
  for (const tab of TABS) {
    frames[tab].addEventListener("load", () => {
      try { frames[tab].contentWindow.addEventListener("keydown", handleSwitchKey); }
      catch (_) {}
    });
  }

  // Poll each frame for (a) its dirty state — to surface the per-tab unsaved
  // dot — and (b) its current selection hash, so a full page reload reopens the
  // same letter/block in each tool.
  setInterval(() => {
    for (const tab of TABS) {
      try {
        const win = frames[tab].contentWindow;
        const doc = win.document;
        const dirty = !!(doc.body && doc.body.classList.contains("dirty"));
        dots[tab].hidden = !dirty;
        if (win.location.hash) localStorage.setItem(HASH_KEY(tab), win.location.hash);
      } catch (_) { /* still loading */ }
    }
  }, 600);

  setActive(active, { focus: false });
})();
</script>
</body>
</html>
