<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio Proof-Listener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
  * { box-sizing: border-box; }
  /* Cool slate-teal that contrasts with the warm beige palette without
     fighting the Wilhelm-blue / Marianne-purple author colors. Used to mark
     the currently-selected nav row and to subtly tint the matching block-id
     in the editor header. */
  :root { --selection-accent: #3a6878; }
  html, body { margin: 0; padding: 0; height: 100vh; font-family: Georgia, "Times New Roman", serif; overflow: hidden; color: #2a2520; background: #f4f1ea; }
  body { display: grid; grid-template-columns: var(--nav-width, 320px) 1fr; grid-template-rows: 100vh; }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing * { user-select: none !important; }
  body.scrubbing { user-select: none; }
  body.scrubbing * { user-select: none !important; }

  button { font-family: inherit; }

  /* Nav */
  #nav { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid #d9cfb8; background: #efe7d4; }
  #nav-fixed { flex: 0 0 auto; }
  #nav-list { flex: 1 1 auto; overflow-y: auto; }
  .autoplay-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: #efe7d4;
    border-bottom: 1px solid #d9cfb8;
    font-size: 0.78rem;
    color: #4a3f32;
    cursor: pointer;
    user-select: none;
  }
  .autoplay-toggle input { cursor: pointer; }
  #nav h1 {
    margin: 0;
    padding: 10px 14px;
    background: #2a2520;
    color: #f4f1ea;
    border-bottom: 3px solid #8a6a3a;
    font-size: 0.95rem;
    font-weight: normal;
    letter-spacing: 0.04em;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  #nav h1 .progress { color: #c9a86a; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }
  #nav .clip { border-bottom: 1px solid #d9cfb8; }
  #nav .clip-header {
    padding: 8px 14px;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    color: #8a6a3a;
    cursor: pointer;
    user-select: none;
    background: #efe7d4;
    border-bottom: 1px solid #e0d5bb;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
  }
  #nav .clip-header .clip-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #nav .clip-header:hover { background: #e8dcc3; }
  #nav .clip-header .count { color: #6a5a3a; letter-spacing: 0.04em; flex-shrink: 0; }
  #nav .clip-section {
    padding: 4px 14px 4px 14px;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #6a5a3a;
    background: #e8dcc3;
    border-top: 1px solid #d9cfb8;
    border-bottom: 1px solid #d9cfb8;
    font-weight: bold;
  }
  #nav ul { list-style: none; padding: 0; margin: 0; background: #f9f5ec; }
  #nav li {
    padding: 5px 14px 5px 18px;
    cursor: pointer;
    font-size: 0.78rem;
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 6px;
    align-items: baseline;
    border-left: 3px solid transparent;
    position: relative;
    color: #3a322a;
  }
  #nav li + li { border-top: 1px solid #efe7d4; }
  #nav li:hover { background: rgba(201, 168, 106, 0.18); }
  #nav li.proofread { color: #8a7a5a; }
  #nav li.proofread::after { content: "✓"; position: absolute; right: 10px; color: #6b7a3a; font-weight: bold; font-size: 0.72rem; }
  #nav li.next-up { border-left-color: #c9a86a; background: rgba(201, 168, 106, 0.22); color: #2a2520; }
  #nav li.next-up::after { content: "▶"; position: absolute; right: 10px; color: #8a6a3a; font-size: 0.7rem; }
  /* .active rule comes last so it wins when an item is also .next-up. */
  #nav li.active {
    background: color-mix(in srgb, var(--selection-accent) 22%, transparent);
    border-left-color: var(--selection-accent);
    color: #2a2520;
  }
  #nav li .ts { font-variant-numeric: tabular-nums; color: #6a5a3a; font-family: "Courier New", Courier, monospace; font-size: 0.74rem; }
  #nav li .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 16px; }
  #nav li.no-ts .ts { color: #b8a888; font-style: italic; }

  /* Main */
  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #fffaf0; position: relative; }
  #splitter { position: absolute; top: 0; bottom: 0; left: -3px; width: 6px; cursor: col-resize; z-index: 10; background: transparent; }
  #splitter:hover, body.resizing #splitter { background: rgba(201, 168, 106, 0.55); }

  #header {
    padding: 10px 14px;
    border-bottom: 1px solid #d9cfb8;
    background: #efe7d4;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  #header .title { font-size: 0.88rem; color: #3a322a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  #header .title strong {
    font-family: "Courier New", Courier, monospace;
    color: var(--selection-accent);
    font-weight: bold;
    letter-spacing: 0.02em;
    margin-right: 6px;
  }
  #header .title .clip-name { color: #6a5a3a; font-style: italic; font-size: 0.82rem; }
  #header .title .ts { font-family: "Courier New", Courier, monospace; color: #2a2520; margin-right: 8px; font-variant-numeric: tabular-nums; }
  #header .title .proofread-dot { color: #6b7a3a; margin-right: 4px; }
  #header .controls { display: flex; gap: 6px; align-items: center; }
  #header .controls button {
    padding: 3px 12px 4px;
    font-size: 0.82rem;
    cursor: pointer;
    background: transparent;
    border: 1px solid #c9a86a;
    border-radius: 2px;
    color: #4a3f32;
    font-family: inherit;
  }
  #header .controls button:hover:not(:disabled) { background: rgba(201, 168, 106, 0.18); color: #2a2520; }
  #header .controls button:disabled { opacity: 0.35; cursor: not-allowed; border-color: #c9bfa3; }
  #position { font-size: 0.72rem; letter-spacing: 0.06em; color: #6a5a3a; font-variant-numeric: tabular-nums; min-width: 56px; text-align: center; }

  /* Audio bar — a transport-controls row on top, full-width waveform below. */
  #audio-bar {
    padding: 10px 14px;
    background: #2a2520;
    color: #c9a86a;
    border-bottom: 1px solid #4a3f32;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #audio-bar .transport-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  #audio-bar #btn-play-pause { width: 38px; padding: 4px 0; font-size: 0.95rem; line-height: 1; }
  #audio-bar .scrubber-time {
    font-family: "Courier New", Courier, monospace;
    font-size: 0.78rem;
    color: #c9a86a;
    font-variant-numeric: tabular-nums;
    min-width: 7em;
    text-align: center;
    letter-spacing: 0.04em;
  }
  #audio-bar .seek-controls { display: flex; gap: 4px; }
  #audio-bar button {
    padding: 4px 10px;
    cursor: pointer;
    background: transparent;
    color: #f4f1ea;
    border: 1px solid #4a3f32;
    border-radius: 2px;
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
  }
  #audio-bar button:hover:not(:disabled) { border-color: #c9a86a; color: #c9a86a; }
  #audio-bar button:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1) brightness(0.55); }
  #audio-bar button.primary { background: #c9a86a; color: #2a2520; border-color: #c9a86a; font-weight: bold; }
  #audio-bar button.primary:hover { background: #d8b878; border-color: #d8b878; color: #1a1510; }
  #audio-bar .speed-group, #audio-bar .proc-group { display: flex; gap: 0; align-items: center; }
  #audio-bar .speed-group button, #audio-bar .proc-group button { border-radius: 0; border-right: none; padding: 4px 8px; }
  #audio-bar .speed-group button:first-child, #audio-bar .proc-group button:first-child { border-radius: 2px 0 0 2px; }
  #audio-bar .speed-group button:last-child, #audio-bar .proc-group button:last-child { border-right: 1px solid #4a3f32; border-radius: 0 2px 2px 0; }
  #audio-bar .speed-group button.active, #audio-bar .proc-group button.active { background: #c9a86a; color: #2a2520; border-color: #c9a86a; font-weight: bold; }
  #audio-bar .label { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: #8a7a5a; }
  /* Denoise status: a progress bar while rendering, a short label otherwise. */
  #audio-bar .proc-status { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; letter-spacing: 0.03em; font-variant-numeric: tabular-nums; min-width: 6em; }
  #audio-bar .proc-bar { display: none; width: 72px; height: 7px; background: #1a1510; border: 1px solid #6a5a3a; border-radius: 4px; overflow: hidden; }
  #audio-bar .proc-status.processing .proc-bar { display: inline-block; }
  #audio-bar .proc-bar-fill { display: block; height: 100%; width: 0; background: #c9a86a; transition: width 0.2s linear; }
  #audio-bar .proc-status.processing .proc-label { color: #d8b878; }
  #audio-bar .proc-status.on .proc-label { color: #9bbd6a; }
  #audio-bar .proc-status.error .proc-label { color: #d98a7a; }
  #audio-bar.no-audio { background: #4a3f32; color: #8a7a5a; }

  /* Waveform scrubber — a canvas amplitude envelope spanning the full width,
     with the lead-in/lead-out spans dimmed and the block's logical start/end
     marked, so it's clear which audio belongs to the current transcript block. */
  #waveform-wrap {
    position: relative;
    width: 100%;
    height: 68px;
    background: #1a1510;
    border: 1px solid #4a3f32;
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
  }
  #waveform-wrap.no-audio { cursor: not-allowed; }
  #waveform { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  /* Dim the audio outside the block's logical [start, end] (the lead-in and
     lead-out); the clear middle band is the audio tied to this block. */
  .wf-region {
    position: absolute; top: 0; bottom: 0;
    background: rgba(8, 6, 4, 0.62);
    pointer-events: none;
  }
  /* Dashed markers at the lead-in / lead-out boundaries. */
  .wf-boundary {
    position: absolute; top: 0; bottom: 0;
    width: 0;
    border-left: 1px dashed #c9a86a;
    opacity: 0.85;
    pointer-events: none;
  }
  .wf-boundary[hidden] { display: none; }
  #wf-playhead {
    position: absolute; top: 0; bottom: 0; left: 0;
    width: 2px;
    background: #f4f1ea;
    box-shadow: 0 0 4px rgba(244, 241, 234, 0.75);
    pointer-events: none;
  }
  .wf-placeholder {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #8a7a5a;
    font-style: italic;
    font-size: 0.82rem;
    pointer-events: none;
  }
  .wf-placeholder[hidden] { display: none; }

  /* Editor */
  #editor-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .editor-stack { position: relative; flex: 1 1 0; min-height: 120px; display: flex; }
  .editor-stack > textarea { flex: 1 1 0; min-height: 0; }
  #editor {
    font-family: "Courier Prime", "Courier New", ui-monospace, monospace;
    font-size: var(--editor-font-size, 14px);
    padding: 12px 16px;
    border: none;
    outline: none;
    resize: none;
    line-height: 1.55;
    tab-size: 4;
    background: #fffaf0;
    color: #2a2520;
    position: relative;
    z-index: 0;
  }
  #editor.bold { font-weight: bold; }
  .editor-overlay {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }
  .editor-overlay .overlay-inner {
    padding: 12px 16px;
    font-family: "Courier Prime", "Courier New", ui-monospace, monospace;
    font-size: var(--editor-font-size, 14px);
    line-height: 1.55;
    tab-size: 4;
    white-space: pre-wrap;
    word-break: break-word;
    color: transparent;
    will-change: transform;
  }
  .editor-overlay .overlay-inner.bold { font-weight: bold; }
  .editor-overlay .overlay-inner mark {
    background: rgba(201, 168, 106, 0.55);
    color: transparent;
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(138, 106, 58, 0.6);
  }
  body.dirty #editor { background: #fff3d6; }
  body.dirty #main { box-shadow: inset 3px 0 0 #8a6a3a; }

  #diff-pane {
    flex: 0 0 auto;
    max-height: 45vh;
    min-height: 60px;
    overflow: auto;
    border-top: 1px solid #d9cfb8;
    background: #f9f5ec;
    font-family: "Courier New", Courier, monospace;
    font-size: 0.82rem;
    padding: 4px 0;
  }
  #diff-pane.empty { display: none; }
  #diff-pane .line { padding: 1px 14px; white-space: pre-wrap; word-break: break-word; }
  #diff-pane .line.ctx { color: #8a7a5a; }
  #diff-pane .line.add { background: #e5ead0; color: #3a4a1a; }
  #diff-pane .line.del { background: #ead7cf; color: #6a1a1a; }
  #diff-pane .line.add .chg { background: #b9c988; color: #1a2a0a; padding: 0 1px; border-radius: 2px; }
  #diff-pane .line.del .chg { background: #d6a697; color: #3a0a0a; padding: 0 1px; border-radius: 2px; text-decoration: none; }
  #diff-pane .hdr {
    padding: 4px 14px;
    color: #8a6a3a;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: #efe7d4;
    border-top: 1px solid #e0d5bb;
    border-bottom: 1px solid #e0d5bb;
  }

  #buttons {
    padding: 10px 14px;
    border-top: 1px solid #d9cfb8;
    background: #efe7d4;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  #buttons button {
    padding: 4px 14px;
    font-size: 0.82rem;
    cursor: pointer;
    border: 1px solid #c9a86a;
    background: transparent;
    border-radius: 2px;
    color: #4a3f32;
    letter-spacing: 0.03em;
    font-family: inherit;
  }
  #buttons button:hover:not(:disabled) { background: rgba(201, 168, 106, 0.18); color: #2a2520; }
  #buttons button:disabled { opacity: 0.35; cursor: not-allowed; border-color: #c9bfa3; }
  #buttons #btn-commit:not(:disabled) { background: #2a2520; color: #c9a86a; border-color: #2a2520; font-weight: bold; }
  #buttons #btn-commit:not(:disabled):hover { background: #3a322a; color: #f4f1ea; }
  #buttons #btn-discard:not(:disabled) { background: transparent; color: #6a1a1a; border-color: #8a4a3a; }
  #buttons #btn-discard:not(:disabled):hover { background: rgba(138, 74, 58, 0.18); color: #4a0a0a; }
  #buttons #btn-mark-proofread { margin-left: auto; background: #c9a86a; color: #2a2520; border-color: #8a6a3a; font-weight: bold; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.72rem; padding: 5px 14px; }
  #buttons #btn-mark-proofread:hover { background: #d8b878; color: #2a2520; }
  #buttons #btn-mark-proofread[hidden] { display: none; }
  #buttons .hint { margin-left: 6px; font-size: 0.68rem; letter-spacing: 0.04em; color: #8a7a5a; font-style: italic; }
  #buttons #btn-bold { font-family: "Courier New", Courier, monospace; font-weight: bold; width: 30px; padding: 4px 0; }
  #buttons #btn-bold.active { background: #2a2520; color: #c9a86a; border-color: #2a2520; }
  #buttons #btn-swap-speaker { font-size: 0.72rem; letter-spacing: 0.04em; padding: 4px 10px; }
  #buttons .sep { color: #c9bfa3; padding: 0 2px; }
  #buttons #font-smaller, #buttons #font-larger { padding: 4px 10px; font-size: 0.78rem; }
  #buttons #font-readout { font-variant-numeric: tabular-nums; font-size: 0.78rem; color: #6a5a3a; min-width: 1.6em; text-align: center; letter-spacing: 0.04em; }

  /* Top pane wraps the transcript/audio/editor stack; the map pane sits below
     it, separated by a draggable horizontal splitter. */
  #top-pane { flex: 1 1 0; min-height: 120px; display: flex; flex-direction: column; overflow: hidden; }
  body.vresizing { cursor: row-resize; user-select: none; }
  body.vresizing * { user-select: none !important; }

  #hsplitter {
    flex: 0 0 7px;
    cursor: row-resize;
    background: #2a2520;
    border-top: 1px solid #4a3f32;
    border-bottom: 1px solid #4a3f32;
    position: relative;
    z-index: 5;
  }
  #hsplitter::after {
    content: "⋯";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -52%);
    color: #8a7a5a;
    font-size: 0.8rem;
    line-height: 0;
    letter-spacing: 0.1em;
  }
  #hsplitter:hover, body.vresizing #hsplitter { background: #8a6a3a; }
  #hsplitter:hover::after, body.vresizing #hsplitter::after { color: #f4f1ea; }

  /* Map pane */
  #map-pane { flex: 0 0 var(--map-height, 320px); min-height: 0; display: flex; flex-direction: column; background: #1a1510; }
  #map-toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    background: #2a2520;
    color: #c9a86a;
    border-bottom: 1px solid #4a3f32;
  }
  #map-toolbar button {
    padding: 3px 12px;
    cursor: pointer;
    background: transparent;
    color: #f4f1ea;
    border: 1px solid #4a3f32;
    border-radius: 2px;
    font-family: inherit;
    font-size: 0.82rem;
    line-height: 1.2;
  }
  #map-toolbar button:hover:not(:disabled) { border-color: #c9a86a; color: #c9a86a; }
  #map-toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  #map-toolbar #map-prev, #map-toolbar #map-next { font-size: 1rem; padding: 1px 12px 3px; }
  #map-toolbar .zoom-group { display: flex; gap: 0; flex-shrink: 0; }
  #map-toolbar .zoom-group button { border-radius: 0; font-size: 1rem; padding: 1px 12px 3px; min-width: 34px; font-variant-numeric: tabular-nums; }
  #map-toolbar .zoom-group button:first-child { border-radius: 2px 0 0 2px; }
  #map-toolbar .zoom-group button:last-child { border-radius: 0 2px 2px 0; border-left: none; }
  #map-label { font-size: 0.8rem; color: #f4f1ea; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #map-counter { font-variant-numeric: tabular-nums; font-size: 0.74rem; color: #8a7a5a; letter-spacing: 0.04em; flex-shrink: 0; }
  #map-toolbar .sep { color: #4a3f32; }
  #map-toolbar .map-hint { margin-left: auto; font-size: 0.68rem; font-style: italic; color: #8a7a5a; letter-spacing: 0.03em; flex-shrink: 0; }

  #map-viewport {
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
    position: relative;
    background:
      repeating-conic-gradient(#211b14 0% 25%, #1a1510 0% 50%) 50% / 28px 28px;
    cursor: grab;
    touch-action: none;  /* we handle pan/pinch ourselves */
  }
  #map-viewport.panning { cursor: grabbing; }
  #map-img {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    max-width: none;
    user-select: none;
    -webkit-user-drag: none;
    will-change: transform;
  }
  #map-pane.empty #map-viewport::after {
    content: "(no maps found in sources/maps)";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #8a7a5a;
    font-style: italic;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <aside id="nav">
    <div id="nav-fixed">
      <h1>Audio transcript <span class="progress" id="nav-progress"></span></h1>
    </div>
    <div id="nav-list"></div>
  </aside>

  <section id="main">
    <div id="top-pane">
    <header id="header">
      <div class="title">
        <span class="proofread-dot" id="lh-proofread" hidden>✓</span>
        <strong id="lh-id">—</strong>
        <span class="ts" id="lh-ts"></span>
        <span class="clip-name" id="lh-clip">—</span>
      </div>
      <div class="controls">
        <span id="position">—</span>
        <button id="btn-prev" title="Previous block">‹ Prev</button>
        <button id="btn-next" title="Next block">Next ›</button>
      </div>
    </header>

    <div id="audio-bar">
      <div class="transport-row">
        <button id="btn-play-from-start" class="primary" title="Play from block start (Ctrl+Shift+Space)">▶ Play from start</button>
        <div class="seek-controls">
          <button id="btn-back-3" title="Skip back 3s">−3s</button>
          <button id="btn-fwd-3" title="Skip forward 3s">+3s</button>
        </div>
        <button id="btn-play-pause" title="Play/pause">▶</button>
        <span class="scrubber-time" id="scrubber-time">0:00 / 0:00</span>
        <audio id="audio" preload="metadata" hidden></audio>
        <span class="label">Speed</span>
        <div class="speed-group" id="speed-group">
          <button data-speed="0.75">0.75×</button>
          <button data-speed="1" class="active">1×</button>
          <button data-speed="1.25">1.25×</button>

        </div>

          <button data-level="low">Low</button>

        <div class="wf-boundary" id="wf-bound-start" hidden></div>
        <div class="wf-boundary" id="wf-bound-end" hidden></div>

      <div class="editor-stack">
        <div id="editor-highlight" class="editor-overlay" hidden><div class="overlay-inner"></div></div>
        <textarea id="editor" spellcheck="false" wrap="soft"></textarea>

    <div id="buttons">
      <button id="btn-commit" disabled title="Commit changes (Ctrl+S)">Commit</button>
      <button id="btn-discard" disabled>Discard</button>
      <span class="sep">·</span>

      <button id="btn-bold" title="Bold editor text">B</button>

      <span id="font-readout" title="Editor font size">14</span>

          <button id="map-zoom-in" title="Zoom in">+</button>

        <span class="map-hint">Scroll/pinch to zoom · drag to pan</span>
      </div>

<script src="/proofread_shared.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const { renderUnifiedDiff, createSearch, highlightHTML } = window.ProofreadShared;

let blocks = [];
let currentIdx = -1;
let currentBlock = null;
let originalText = "";
let pendingSeek = null;  // seconds to seek to once metadata loads
let pendingPlay = false; // call audio.play() once metadata loads
let lastLoadedAudio = "";
let searchIndex = [];
let search = null;
let blockStart = 0;      // seconds in source file at which current block begins
let blockEnd = null;     // seconds in source at which next block begins; null = use audio.duration
let scrubbing = false;
const AUTOPLAY_KEY = "audio_proofread.autoplay";

// Optional noise reduction. `procLevel` is a global strength (off/low/medium/
// high) applied to whichever clip is active; the cleaned render is fetched once
// per clip+level and cached here so re-selecting is instant.
const PROC_KEY = "audio_proofread.procLevel";
const PROC_LEVELS = ["off", "low", "medium", "high"];
let procLevel = "off";
let procReqToken = 0;
const procUrlCache = new Map();   // `${clip}|${level}` -> processed audio url
let procCleaning = false;         // a render is in progress for the active block
let procResume = false;           // resume playback when the render completes

async function api(url, opts) {
  const r = await fetch(url, opts || {});
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
}

function isDirty() {
  return currentBlock && $("editor").value !== originalText;
}

function fmtTs(secs) {
  if (secs == null) return "—";
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function shortenClip(clip) {
  if (!clip) return "(transcript-level)";
  // "Erinnerungen - Opa I (Edison-June 10, 1982)/01 Kriegspfad 1941.mp3"
  // → "Opa I · 01 Kriegspfad 1941"
  const slash = clip.lastIndexOf("/");
  const folder = slash >= 0 ? clip.slice(0, slash) : "";
  const file = slash >= 0 ? clip.slice(slash + 1) : clip;
  const fileShort = file.replace(/\.mp3$/i, "");
  const folderShort = folder.replace(/^Erinnerungen\s*-\s*/, "")
                            .replace(/\s*\(.*?\)\s*$/, "")
                            .trim();
  return folderShort ? `${folderShort} · ${fileShort}` : fileShort;
}

function updateDirty() {
  const dirty = isDirty();
  document.body.classList.toggle("dirty", !!dirty);
  $("btn-commit").disabled = !dirty;
  $("btn-discard").disabled = !dirty;
  $("btn-prev").disabled = !!dirty || currentIdx <= 0;
  $("btn-next").disabled = !!dirty || currentIdx >= blocks.length - 1;
  const mp = $("btn-mark-proofread");
  const eligible = currentBlock && currentBlock.is_next_to_proofread;
  mp.hidden = !eligible;
  mp.disabled = !!dirty;
}

async function init() {
  blocks = await api("/api/blocks");
  searchIndex = await api("/api/audio/search-index");
  search = createSearch({
    navRoot: $("nav-list"),
    getIndex: () => searchIndex,
    getCurrentId: () => currentBlock ? currentBlock.id : null,
    onSelect: (id) => {
      const i = blocks.findIndex(b => b.id === id);
      if (i >= 0) selectBlockByIdx(i);
    },
    onQueryChanged: () => updateEditorHighlight(),
  });
  $("nav-fixed").appendChild(search.element);

  const autoplayLabel = document.createElement("label");
  autoplayLabel.className = "autoplay-toggle";
  autoplayLabel.innerHTML = `<input type="checkbox" id="autoplay-toggle"> Autoplay on navigate`;
  $("nav-fixed").appendChild(autoplayLabel);
  const ap = $("autoplay-toggle");
  ap.checked = localStorage.getItem(AUTOPLAY_KEY) === "1";
  ap.addEventListener("change", () => {
    localStorage.setItem(AUTOPLAY_KEY, ap.checked ? "1" : "0");
  });

  renderNav();
  const hash = location.hash.slice(1);
  let idx = 0;
  if (hash) {
    const i = blocks.findIndex(b => b.id === hash);
    if (i >= 0) idx = i;
  } else {
    const next = blocks.findIndex(b => b.is_next_to_proofread);
    if (next >= 0) idx = next;
  }
  await selectBlockByIdx(idx, /*force*/ true);
}

async function refreshSearchIndex() {
  searchIndex = await api("/api/audio/search-index");
  if (search) search.refresh();
}

function renderNav() {
  const byClip = [];
  let cur = null;
  blocks.forEach((b, i) => {
    if (!cur || cur.clip !== b.clip) {
      cur = { clip: b.clip, items: [] };
      byClip.push(cur);
    }
    cur.items.push({ ...b, idx: i });
  });
  const list = $("nav-list");
  list.innerHTML = "";
  const proofreadCount = blocks.filter(b => b.proofread).length;
  $("nav-progress").textContent = `${proofreadCount} / ${blocks.length} done`;

  // Group clips by parent folder (recording session) for visual structure.
  let lastFolder = null;
  byClip.forEach(group => {
    const clip = group.clip || "";
    const slash = clip.lastIndexOf("/");
    const folder = slash >= 0 ? clip.slice(0, slash) : "";
    if (folder !== lastFolder) {
      const sec = document.createElement("div");
      sec.className = "clip-section";
      sec.textContent = folder || "(root)";
      list.appendChild(sec);
      lastFolder = folder;
    }
    const div = document.createElement("div");
    div.className = "clip";
    const fileShort = (slash >= 0 ? clip.slice(slash + 1) : clip).replace(/\.mp3$/i, "") || "(no clip)";
    div.innerHTML = `<div class="clip-header"><span class="clip-title" title="${escAttr(clip || "(transcript-level)")}">${escHtml(fileShort)}</span><span class="count">${group.items.length}</span></div><ul></ul>`;
    const ul = div.querySelector("ul");
    group.items.forEach(b => {
      const li = document.createElement("li");
      li.dataset.idx = b.idx;
      li.dataset.sid = b.id;
      const classes = [];
      if (b.proofread) classes.push("proofread");
      if (b.is_next_to_proofread) classes.push("next-up");
      if (b.start_seconds == null) classes.push("no-ts");
      li.className = classes.join(" ");
      const tsLabel = b.start_seconds == null ? "—" : fmtTs(b.start_seconds);
      li.innerHTML =
        `<span class="ts">${tsLabel}</span>` +
        `<span class="text">${escHtml(b.preview || "")}</span>`;
      li.title = b.preview || "";
      li.addEventListener("click", () => selectBlockByIdx(b.idx));
      ul.appendChild(li);
    });
    list.appendChild(div);
  });
  if (search) search.applyHighlights();
  updateNavActive();
}

function escHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function escAttr(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function updateNavActive() {
  document.querySelectorAll("#nav-list li").forEach(li => {
    li.classList.toggle("active", Number(li.dataset.idx) === currentIdx);
  });
  const active = document.querySelector("#nav-list li.active");
  if (active) active.scrollIntoView({ block: "nearest" });
  if (search) search.update();
}

async function selectBlockByIdx(idx, force) {
  if (!force && isDirty()) {
    alert("You have unsaved changes. Commit or discard them first.");
    return;
  }
  if (idx < 0 || idx >= blocks.length) return;
  currentIdx = idx;
  const bid = blocks[idx].id;
  currentBlock = await api(`/api/block/${bid}`);
  originalText = currentBlock.raw_text;
  $("editor").value = originalText;

  $("lh-id").textContent = currentBlock.id;
  $("lh-ts").textContent = currentBlock.start_seconds == null ? "" : `[${fmtTs(currentBlock.start_seconds)}]`;
  $("lh-clip").textContent = shortenClip(currentBlock.clip);
  $("lh-clip").title = currentBlock.clip || "";
  $("lh-proofread").hidden = !currentBlock.proofread;
  $("position").textContent = `${idx + 1} / ${blocks.length}`;
  location.hash = bid;

  updateAudioForBlock();
  updateDirty();
  updateDiff();
  updateNavActive();
  updateEditorHighlight();
}

function autoplayEnabled() {
  const el = $("autoplay-toggle");
  return !!(el && el.checked);
}

function computeBlockEnd(idx) {
  if (idx < 0 || idx >= blocks.length) return null;
  const cur = blocks[idx];
  if (!cur || !cur.clip) return null;
  for (let i = idx + 1; i < blocks.length; i++) {
    if (blocks[i].clip !== cur.clip) break;
    if (blocks[i].start_seconds != null) return blocks[i].start_seconds;
  }
  return null; // last block in clip — fall back to audio.duration when known
}

// Start playback 2 seconds before the block's logical start so the spoken
// content doesn't begin abruptly and a little of the previous segment is
// audible for context. Clamped to 0 so blocks that begin at the very top of an
// mp3 file aren't shifted into negative time. The displayed playback range is
// [leadInStart, leadOutEnd], so both the lead-in and the lead-out count toward
// the clip length shown in the scrubber/time-readout.
function leadInStart() {
  return Math.max(0, blockStart - 2);
}

// Mirror of leadInStart() at the tail end: play ~2 seconds past the block's
// logical end so a little of the next segment is audible for context.
//
// For a normal block this is purely transcript-derived (blockEnd + 2) and must
// NOT depend on audio.duration: an <audio> element's reported duration for an
// MP3 starts as an estimate and refines while it loads, so clamping the window
// to it made the playhead's denominator drift (running ahead or behind until
// the duration settled). Only the last block in a clip — which has no next
// block to bound it — falls back to the file duration once that's known.
function leadOutEnd() {
  if (blockEnd != null) return blockEnd + 2;
  const dur = $("audio").duration;
  return Number.isFinite(dur) ? dur : null;
}

function blockDuration() {
  const audio = $("audio");
  const end = leadOutEnd();
  const e = end != null ? end : (audio.duration || 0);
  return Math.max(0, e - leadInStart());
}

// ---- waveform scrubber ----
// A canvas amplitude envelope of the current block's audio window
// [leadInStart, leadOutEnd]. Peaks come from the server (ffmpeg) at a fixed
// resolution and are cached per window; the canvas re-renders from the cached
// peaks on resize without re-fetching. The lead-in/lead-out spans are dimmed
// and the block's logical start/end are marked so it's clear which audio is
// associated with the current transcript block.
const WF_BUCKETS = 1200;
const wfCache = new Map();   // window key -> {min:[], max:[]}
let wfPeaks = null;          // peaks for the current window, or null
let wfWinStart = 0, wfWinEnd = 0;
let wfReqToken = 0;          // guards against out-of-order fetch responses

function clearWaveform() {
  const canvas = $("waveform");
  canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
}

function renderWaveform() {
  const canvas = $("waveform");
  const wrap = $("waveform-wrap");
  const dpr = window.devicePixelRatio || 1;
  const W = Math.max(1, Math.round(wrap.clientWidth));
  const H = Math.max(1, Math.round(wrap.clientHeight));
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!wfPeaks) return;
  const mins = wfPeaks.min, maxs = wfPeaks.max;
  const n = Math.min(mins.length, maxs.length);
  if (!n) return;
  // Auto-gain so quiet speech is visible; clamp so near-silence isn't blown up.
  let peak = 0;
  for (let i = 0; i < n; i++) {
    const a = Math.max(Math.abs(mins[i]), Math.abs(maxs[i]));
    if (a > peak) peak = a;
  }
  const gain = peak > 0.01 ? Math.min(0.95 / peak, 12) : 1;
  const mid = H / 2;
  ctx.fillStyle = "#c9a86a";
  for (let x = 0; x < W; x++) {
    const i0 = Math.floor(x / W * n);
    const i1 = Math.max(i0 + 1, Math.floor((x + 1) / W * n));
    let mn = 1, mx = -1;
    for (let i = i0; i < i1 && i < n; i++) {
      if (mins[i] < mn) mn = mins[i];
      if (maxs[i] > mx) mx = maxs[i];
    }
    if (mn > mx) { mn = 0; mx = 0; }
    let yTop = mid - mx * gain * mid;
    let yBot = mid - mn * gain * mid;
    if (yTop < 0) yTop = 0;
    if (yBot > H) yBot = H;
    ctx.fillRect(x, yTop, 1, Math.max(1, yBot - yTop));
  }
}

// Place the dimming overlays and boundary markers from the current window
// [wfWinStart, wfWinEnd] and the block's logical [blockStart, blockEnd].
function positionWaveformOverlays() {
  const total = Math.max(0.001, wfWinEnd - wfWinStart);
  const clamp = v => Math.max(0, Math.min(100, v));
  const startPct = ((blockStart - wfWinStart) / total) * 100;
  const blockEndSec = blockEnd != null ? blockEnd : wfWinEnd;
  const endPct = ((blockEndSec - wfWinStart) / total) * 100;
  $("wf-leadin").style.left = "0%";
  $("wf-leadin").style.width = clamp(startPct) + "%";
  $("wf-leadout").style.left = clamp(endPct) + "%";
  $("wf-leadout").style.width = clamp(100 - endPct) + "%";
  $("wf-bound-start").style.left = clamp(startPct) + "%";
  $("wf-bound-end").style.left = clamp(endPct) + "%";
  $("wf-bound-start").hidden = startPct <= 0.2;   // block starts the clip — no lead-in
  $("wf-bound-end").hidden = endPct >= 99.8;       // last block / file end — no lead-out
}

function loadWaveform() {
  const hasAudio = !!(currentBlock && currentBlock.clip && currentBlock.start_seconds != null);
  $("wf-placeholder").hidden = hasAudio;
  if (!hasAudio) { wfPeaks = null; clearWaveform(); return; }
  const winStart = leadInStart();
  const winEnd = leadOutEnd();
  if (winEnd == null) {            // duration not known yet (last block) — wait for metadata
    wfPeaks = null; clearWaveform();
    return;
  }
  wfWinStart = winStart;
  wfWinEnd = winEnd;
  positionWaveformOverlays();
  const dur = Math.max(0.1, winEnd - winStart);
  // Draw the waveform from whatever file is actually playing — the processed
  // (denoised) render when active, else the original clip — so the waveform's
  // timeline is identical to the audio and the playhead lines up exactly.
  const src = $("audio").src || "";
  const m = src.match(/\/audio-proc\/([0-9a-f]{16}\.[a-z0-9]+)/);
  const srcParam = m ? `proc=${encodeURIComponent(m[1])}`
                     : `clip=${encodeURIComponent(currentBlock.clip)}`;
  const srcKey = m ? `proc:${m[1]}` : `clip:${currentBlock.clip}`;
  const key = `${srcKey}|${winStart.toFixed(2)}|${dur.toFixed(2)}`;
  if (wfCache.has(key)) {
    wfPeaks = wfCache.get(key);
    renderWaveform();
    return;
  }
  wfPeaks = null;
  clearWaveform();
  const token = ++wfReqToken;
  const url = `/api/audio/waveform?${srcParam}`
    + `&start=${winStart.toFixed(3)}&dur=${dur.toFixed(3)}&buckets=${WF_BUCKETS}`;
  fetch(url).then(r => r.ok ? r.json() : null).then(data => {
    if (token !== wfReqToken) return;          // a newer block was selected meanwhile
    if (!data || data.error) { wfPeaks = null; clearWaveform(); return; }
    wfPeaks = { min: data.min, max: data.max };
    wfCache.set(key, wfPeaks);
    if (wfCache.size > 50) wfCache.delete(wfCache.keys().next().value);
    renderWaveform();
  }).catch(() => { if (token === wfReqToken) { wfPeaks = null; clearWaveform(); } });
}

function updateAudioForBlock() {
  const audio = $("audio");
  const bar = $("audio-bar");
  blockStart = (currentBlock && currentBlock.start_seconds) || 0;
  blockEnd = computeBlockEnd(currentIdx);

  // A block only has playable audio if it has both a clip and a [m:ss]
  // timestamp on its first line. Meta paragraphs ("(0:28–4:05 weitgehend
  // unverständlich; …)") describe a span of audio but aren't playable
  // material — start_seconds is null, so disable playback.
  const hasAudio = !!(currentBlock && currentBlock.clip && currentBlock.start_seconds != null);
  const audioUrl = hasAudio ? currentBlock.audio_url : "";
  const playbackBtns = [
    $("btn-play-from-start"), $("btn-back-3"), $("btn-fwd-3"),
    $("btn-play-pause"),
    ...document.querySelectorAll("#speed-group button"),
  ];
  $("waveform-wrap").classList.toggle("no-audio", !audioUrl);
  if (!audioUrl) {
    bar.classList.add("no-audio");
    audio.removeAttribute("src");
    audio.load();
    playbackBtns.forEach(b => { b.disabled = true; });
    pendingSeek = null;
    pendingPlay = false;
    loadWaveform();
    updateAudioPosition();
    return;
  }
  bar.classList.remove("no-audio");
  playbackBtns.forEach(b => { b.disabled = false; });

  const target = leadInStart();
  const shouldPlay = autoplayEnabled();
  resolveAudioSource(audioUrl, target, shouldPlay);
  loadWaveform();
  updateAudioPosition();
}

// Point the <audio> at `url`, seeking to `seekTo` and optionally playing. If
// it's already the loaded source, just seek (no reload) — this keeps within-clip
// navigation gap-free.
function setAudioSrc(url, seekTo, play) {
  const audio = $("audio");
  if (url === lastLoadedAudio && audio.src) {
    try { audio.currentTime = seekTo; } catch { pendingSeek = seekTo; }
    if (play) audio.play().catch(() => {});
    return;
  }
  pendingSeek = seekTo;
  pendingPlay = play;
  audio.src = url;
  audio.load();
  lastLoadedAudio = url;
}

// Choose the audio file for the current block: the original when denoise is
// Off, otherwise the cached denoised render. When a render is needed we pause
// playback while it runs (showing a progress bar) and resume on completion —
// unless the user explicitly paused in the meantime. A token (bumped on every
// call) supersedes any in-flight render handling when the block or level
// changes.
async function resolveAudioSource(origUrl, seekTo, shouldPlay) {
  const block = currentBlock;
  const audio = $("audio");
  const token = ++procReqToken;       // supersede any earlier in-flight handling
  if (procLevel === "off") {
    procCleaning = false;
    setProcStatus("");
    setAudioSrc(origUrl, seekTo, shouldPlay);
    return;
  }
  const ckey = `${block.clip}|${procLevel}`;
  const known = procUrlCache.get(ckey);
  if (known) {                        // already rendered this clip+level — use it
    procCleaning = false;
    setProcStatus("on");
    setAudioSrc(known, seekTo, shouldPlay);
    return;
  }
  // Needs rendering: load the original at the right spot but pause while we
  // clean, remembering whether to resume when it's ready.
  setAudioSrc(origUrl, seekTo, false);
  audio.pause();
  procCleaning = true;
  procResume = shouldPlay;
  setProcStatus("processing", 0);
  try {
    const start = await api(`/api/audio/process?clip=${encodeURIComponent(block.clip)}&level=${procLevel}`);
    if (token !== procReqToken || currentBlock !== block) return;   // superseded
    if (start && start.ready && start.url) { finishClean(block, ckey, token, start.url); return; }
    if (!start || !start.token) { failClean(token); return; }
    pollClean(block, ckey, token, start.token);
  } catch {
    failClean(token);
  }
}

function pollClean(block, ckey, token, jobToken) {
  const tick = async () => {
    if (token !== procReqToken) return;        // superseded — stop polling
    let s;
    try { s = await api(`/api/audio/process-status?token=${encodeURIComponent(jobToken)}`); }
    catch { failClean(token); return; }
    if (token !== procReqToken) return;
    if (s.ready && s.url) { finishClean(block, ckey, token, s.url); return; }
    if (s.error) { failClean(token); return; }
    setProcStatus("processing", s.progress || 0);
    setTimeout(tick, 350);
  };
  tick();
}

function finishClean(block, ckey, token, url) {
  procUrlCache.set(ckey, url);                 // cache even if superseded — useful later
  if (token !== procReqToken || currentBlock !== block) return;
  procCleaning = false;
  const audio = $("audio");
  const pos = audio.src ? audio.currentTime : leadInStart();
  setAudioSrc(url, pos, procResume);
  setProcStatus("on");
}

function failClean(token) {
  if (token !== procReqToken) return;
  procCleaning = false;
  setProcStatus("error");
}

function setProcStatus(state, progress) {
  const el = $("proc-status");
  el.className = "proc-status" + (state ? " " + state : "");
  if (state === "processing") {
    const pct = Math.round((progress || 0) * 100);
    $("proc-bar-fill").style.width = pct + "%";
    $("proc-label").textContent = pct + "%";
  } else {
    $("proc-label").textContent = state === "on" ? "Cleaned"
      : state === "error" ? "Failed" : "";
  }
}

function updateAudioPosition() {
  const audio = $("audio");
  const dur = blockDuration();
  const ph = $("wf-playhead");
  if (dur <= 0 || !audio.src) {
    ph.style.left = "0%";
    $("scrubber-time").textContent = "0:00 / 0:00";
    return;
  }
  const rel = Math.max(0, Math.min(dur, (audio.currentTime || 0) - leadInStart()));
  const pct = (rel / dur) * 100;
  ph.style.left = `${pct}%`;
  $("scrubber-time").textContent = `${fmtTs(Math.floor(rel))} / ${fmtTs(Math.floor(dur))}`;
}

function playFromStart() {
  if (!currentBlock || !currentBlock.clip) return;
  if (procCleaning) procResume = true;   // explicit play means resume when clean
  const audio = $("audio");
  const target = leadInStart();
  const seek = () => {
    try { audio.currentTime = target; } catch {}
    audio.play().catch(() => {});
  };
  if (audio.readyState >= 1) seek();
  else { pendingSeek = target; audio.addEventListener("loadedmetadata", () => audio.play().catch(() => {}), { once: true }); }
}

$("audio").addEventListener("loadedmetadata", () => {
  if (pendingSeek != null) {
    try { $("audio").currentTime = pendingSeek; } catch {}
    pendingSeek = null;
  }
  if (pendingPlay) {
    pendingPlay = false;
    $("audio").play().catch(() => {});
  }
  loadWaveform();   // window end for the last block in a clip needs the duration
  updateAudioPosition();
});
$("audio").addEventListener("durationchange", () => { loadWaveform(); updateAudioPosition(); });
$("audio").addEventListener("timeupdate", () => {
  const audio = $("audio");
  // Constrain playback to the current block plus its lead-out. When the
  // playhead crosses leadOutEnd (blockEnd + 2s, or audio.duration if there's no
  // next block), pause and snap to the boundary so the seek bar UI stays inside
  // [leadInStart, leadOutEnd].
  const limit = leadOutEnd();
  if (limit != null && audio.currentTime >= limit && !audio.paused) {
    audio.pause();
    try { audio.currentTime = limit; } catch {}
  }
  if (!scrubbing) updateAudioPosition();
});
// The audio element's `timeupdate` only fires ~4x/sec, which makes the playhead
// step jerkily. Drive it from requestAnimationFrame while playing instead, so it
// sweeps at the display refresh rate (~60fps), reading currentTime each frame.
let playheadRaf = null;
function playheadLoop() {
  updateAudioPosition();
  playheadRaf = $("audio").paused ? null : requestAnimationFrame(playheadLoop);
}
$("audio").addEventListener("play", () => {
  $("btn-play-pause").textContent = "⏸";
  if (playheadRaf == null) playheadRaf = requestAnimationFrame(playheadLoop);
});
$("audio").addEventListener("pause", () => {
  $("btn-play-pause").textContent = "▶";
  if (playheadRaf != null) { cancelAnimationFrame(playheadRaf); playheadRaf = null; }
  updateAudioPosition();
});

// ---- diff ----
function updateDiff() {
  const diff = $("diff-pane");
  if (!isDirty()) {
    diff.classList.add("empty");
    diff.innerHTML = "";
    return;
  }
  diff.classList.remove("empty");
  const a = originalText.split("\n");
  const b = $("editor").value.split("\n");
  diff.innerHTML = renderUnifiedDiff(a, b);
}

// ---- swap speaker on cursor line ----
function swapSpeakerAtCursor() {
  const ed = $("editor");
  const val = ed.value;
  const pos = ed.selectionStart;
  // Find line bounds containing cursor.
  let ls = val.lastIndexOf("\n", pos - 1) + 1;
  let le = val.indexOf("\n", pos);
  if (le === -1) le = val.length;
  const line = val.slice(ls, le);
  const swapped = line
    .replace(/\[Wilhelm\]/g, "\x00")
    .replace(/\[Tilman\]/g, "[Wilhelm]")
    .replace(/\x00/g, "[Tilman]");
  if (swapped === line) return;
  ed.value = val.slice(0, ls) + swapped + val.slice(le);
  ed.setSelectionRange(pos, pos);
  updateDirty();
  updateDiff();
}

// ---- search-hit overlay ----
// Mirrors the textarea contents in a non-interactive layer behind it, with
// <mark>-wrapped match runs. Visible only when search is active and the
// textarea isn't focused — highlighting is a display-mode aid only.
function updateEditorHighlight() {
  const overlay = $("editor-highlight");
  if (!overlay) return;
  const inner = overlay.querySelector(".overlay-inner");
  const editor = $("editor");
  const q = search ? search.getQuery() : "";
  const focused = document.activeElement === editor;
  const shouldShow = !!q && !focused;
  overlay.hidden = !shouldShow;
  if (!shouldShow) return;
  inner.classList.toggle("bold", editor.classList.contains("bold"));
  inner.innerHTML = highlightHTML(editor.value, q);
  inner.style.transform = `translate(${-editor.scrollLeft}px, ${-editor.scrollTop}px)`;
}

$("editor").addEventListener("focus", updateEditorHighlight);
$("editor").addEventListener("blur", updateEditorHighlight);
$("editor").addEventListener("scroll", () => {
  const inner = $("editor-highlight").querySelector(".overlay-inner");
  const editor = $("editor");
  inner.style.transform = `translate(${-editor.scrollLeft}px, ${-editor.scrollTop}px)`;
});

// ---- events ----
$("editor").addEventListener("input", () => {
  updateDirty();
  updateDiff();
});

$("btn-commit").addEventListener("click", async () => {
  const r = await fetch(`/api/block/${currentBlock.id}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: $("editor").value }),
  });
  if (!r.ok) { alert("Save failed"); return; }
  const data = await r.json();
  originalText = $("editor").value;
  blocks = data.blocks;
  const updated = blocks[currentIdx];
  if (updated) {
    currentBlock.proofread = updated.proofread;
    currentBlock.is_next_to_proofread = updated.is_next_to_proofread;
  }
  await refreshSearchIndex();
  renderNav();
  updateDirty();
  updateDiff();
  $("lh-proofread").hidden = !currentBlock.proofread;
});

$("btn-discard").addEventListener("click", () => {
  $("editor").value = originalText;
  updateDirty();
  updateDiff();
});

$("btn-mark-proofread").addEventListener("click", async () => {
  if (isDirty()) { alert("Commit or discard first."); return; }
  const r = await fetch(`/api/mark-proofread/${currentBlock.id}`, { method: "POST" });
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    alert("Mark failed: " + (err.error || r.status));
    return;
  }
  const data = await r.json();
  blocks = data.blocks;
  await refreshSearchIndex();
  renderNav();
  const nextIdx = currentIdx + 1;
  if (nextIdx < blocks.length) await selectBlockByIdx(nextIdx, /*force*/ true);
  else await selectBlockByIdx(currentIdx, /*force*/ true);
});

$("btn-prev").addEventListener("click", () => selectBlockByIdx(currentIdx - 1));
$("btn-next").addEventListener("click", () => selectBlockByIdx(currentIdx + 1));

$("btn-play-from-start").addEventListener("click", playFromStart);
$("btn-back-3").addEventListener("click", () => {
  const a = $("audio");
  if (!a.src) return;
  try { a.currentTime = Math.max(leadInStart(), a.currentTime - 3); } catch {}
});
$("btn-fwd-3").addEventListener("click", () => {
  const a = $("audio");
  if (!a.src) return;
  const limit = leadOutEnd();
  try { a.currentTime = Math.min(limit != null ? limit : Infinity, a.currentTime + 3); } catch {}
});

$("btn-play-pause").addEventListener("click", () => {
  const audio = $("audio");
  if (!audio.src) return;
  if (audio.paused) {
    const lo = leadOutEnd();
    const limit = lo != null ? lo : Infinity;
    const lead = leadInStart();
    if (audio.currentTime < lead || audio.currentTime >= limit) {
      try { audio.currentTime = lead; } catch {}
    }
    audio.play().catch(() => {});
  } else {
    audio.pause();
  }
  // Explicit play/pause during a clean overrides whether we auto-resume after.
  if (procCleaning) procResume = !audio.paused;
});

function seekToScrubber(e) {
  const audio = $("audio");
  if (!audio.src) return;
  const rect = $("waveform-wrap").getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  const dur = blockDuration();
  if (dur <= 0) return;
  try { audio.currentTime = leadInStart() + ratio * dur; } catch {}
  updateAudioPosition();
}
$("waveform-wrap").addEventListener("mousedown", e => {
  if (!$("audio").src) return;
  scrubbing = true;
  document.body.classList.add("scrubbing");
  seekToScrubber(e);
  e.preventDefault();
});
window.addEventListener("mousemove", e => {
  if (scrubbing) seekToScrubber(e);
});
window.addEventListener("mouseup", () => {
  if (scrubbing) {
    scrubbing = false;
    document.body.classList.remove("scrubbing");
  }
});

// Speed buttons.
$("speed-group").addEventListener("click", e => {
  const btn = e.target.closest("button[data-speed]");
  if (!btn) return;
  const speed = Number(btn.dataset.speed);
  $("audio").playbackRate = speed;
  localStorage.setItem("audio.speed", String(speed));
  document.querySelectorAll("#speed-group button").forEach(b =>
    b.classList.toggle("active", b === btn));
});
{
  const saved = Number(localStorage.getItem("audio.speed")) || 1;
  $("audio").playbackRate = saved;
  document.querySelectorAll("#speed-group button").forEach(b =>
    b.classList.toggle("active", Number(b.dataset.speed) === saved));
}

// Denoise strength selector — applies to the active clip (cached per clip+level).
{
  const saved = localStorage.getItem(PROC_KEY);
  if (PROC_LEVELS.includes(saved)) procLevel = saved;
  document.querySelectorAll("#proc-group button").forEach(b =>
    b.classList.toggle("active", b.dataset.level === procLevel));
}
$("proc-group").addEventListener("click", e => {
  const btn = e.target.closest("button[data-level]");
  if (!btn || btn.dataset.level === procLevel) return;
  procLevel = btn.dataset.level;
  localStorage.setItem(PROC_KEY, procLevel);
  document.querySelectorAll("#proc-group button").forEach(b =>
    b.classList.toggle("active", b === btn));
  // Re-resolve the current block's audio at the new level, keeping position.
  if (currentBlock && currentBlock.clip && currentBlock.start_seconds != null) {
    const audio = $("audio");
    const pos = audio.src ? audio.currentTime : leadInStart();
    const wasPlaying = audio.src ? !audio.paused : false;
    resolveAudioSource(currentBlock.audio_url, pos, wasPlaying);
  } else {
    setProcStatus("");
  }
});

$("audio").addEventListener("ratechange", () => {
  // Keep in sync if browser changes rate via its own controls.
  const r = $("audio").playbackRate;
  document.querySelectorAll("#speed-group button").forEach(b =>
    b.classList.toggle("active", Math.abs(Number(b.dataset.speed) - r) < 0.01));
});

$("btn-swap-speaker").addEventListener("click", () => {
  swapSpeakerAtCursor();
  $("editor").focus();
});

// Bold toggle for the editor text — persisted.
const BOLD_KEY = "audio_proofread.bold";
function applyBold(on) {
  $("editor").classList.toggle("bold", on);
  $("btn-bold").classList.toggle("active", on);
  localStorage.setItem(BOLD_KEY, on ? "1" : "0");
  updateEditorHighlight();
}
applyBold(localStorage.getItem(BOLD_KEY) === "1");
$("btn-bold").addEventListener("click", () => applyBold(!$("editor").classList.contains("bold")));

// Editor font size — persisted.
const FONT_KEY = "audio_proofread.fontSize";
const FONT_MIN = 10, FONT_MAX = 22;
function applyFont(px) {
  const clamped = Math.max(FONT_MIN, Math.min(FONT_MAX, Math.round(Number(px) || 14)));
  document.documentElement.style.setProperty("--editor-font-size", `${clamped}px`);
  $("font-readout").textContent = String(clamped);
  localStorage.setItem(FONT_KEY, String(clamped));
  $("font-smaller").disabled = clamped <= FONT_MIN;
  $("font-larger").disabled = clamped >= FONT_MAX;
}
applyFont(Number(localStorage.getItem(FONT_KEY)) || 14);
$("font-smaller").addEventListener("click", () => applyFont(parseInt($("font-readout").textContent, 10) - 1));
$("font-larger").addEventListener("click", () => applyFont(parseInt($("font-readout").textContent, 10) + 1));

// Splitter — drag the nav width.
const NAV_KEY = "audio_proofread.navWidth";
function applyNavWidth(px) {
  const minW = 220;
  const maxW = Math.max(minW, window.innerWidth - 360);
  const clamped = Math.max(minW, Math.min(maxW, Math.round(px)));
  document.documentElement.style.setProperty("--nav-width", `${clamped}px`);
  localStorage.setItem(NAV_KEY, String(clamped));
}
applyNavWidth(Number(localStorage.getItem(NAV_KEY)) || 320);

let dragging = false;
$("splitter").addEventListener("mousedown", e => {
  dragging = true;
  document.body.classList.add("resizing");
  e.preventDefault();
});
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  applyNavWidth(e.clientX);
});
window.addEventListener("mouseup", () => {
  if (dragging) { dragging = false; document.body.classList.remove("resizing"); }
});
window.addEventListener("resize", () => applyNavWidth(Number(localStorage.getItem(NAV_KEY)) || 320));

document.addEventListener("keydown", e => {
  const isMod = e.ctrlKey || e.metaKey;
  if (isMod && e.key === "s") {
    e.preventDefault();
    if (isDirty()) $("btn-commit").click();
  } else if (isMod && e.shiftKey && (e.key === "M" || e.key === "m")) {
    e.preventDefault();
    const btn = $("btn-mark-proofread");
    if (!btn.hidden && !btn.disabled) btn.click();
  } else if (isMod && e.shiftKey && (e.key === "W" || e.key === "w")) {
    e.preventDefault();
    swapSpeakerAtCursor();
  } else if (isMod && e.shiftKey && e.code === "Space") {
    e.preventDefault();
    if (!$("btn-play-from-start").disabled) playFromStart();
  }
});

window.addEventListener("beforeunload", e => {
  if (isDirty()) { e.preventDefault(); e.returnValue = ""; }
});

// Re-render the waveform (from cached peaks — no re-fetch) and reposition the
// overlays whenever the pane width changes: nav/map splitter drags, window
// resize, or the tab becoming visible.
if (window.ResizeObserver) {
  let rafPending = false;
  const ro = new ResizeObserver(() => {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      renderWaveform();
      positionWaveformOverlays();
      updateAudioPosition();
    });
  });
  ro.observe($("waveform-wrap"));
}

init();
})();
</script>

<script>
// ---- Map pane: cycle / zoom / pan, with per-map view memory ----
(() => {
const $ = id => document.getElementById(id);
const MAP_IDX_KEY = "audio_proofread.mapIdx";
const MAP_H_KEY = "audio_proofread.mapHeight";
const MAP_VIEWS_KEY = "audio_proofread.mapViews";
const SCALE_MIN = 0.05, SCALE_MAX = 25;

const img = $("map-img");
const vp = $("map-viewport");

let maps = [];
let mapIdx = 0;
// Per-map remembered view, keyed by filename: { scale, tx, ty }. Persisted to
// localStorage so pan/zoom survives page refreshes and server restarts.
const views = (() => {
  try {
    const v = JSON.parse(localStorage.getItem(MAP_VIEWS_KEY) || "{}");
    return v && typeof v === "object" ? v : {};
  } catch { return {}; }
})();
let view = { scale: 1, tx: 0, ty: 0 };
// Filename the live `view` describes. Guards saveView() so we never persist a
// view for a map that hasn't actually been displayed (otherwise the first
// loadMap() would clobber the first map's view with the initial default).
let viewFile = null;

function applyTransform() {
  img.style.transform =
    `translate(${view.tx}px, ${view.ty}px) scale(${view.scale})`;
}

function clampScale(s) { return Math.max(SCALE_MIN, Math.min(SCALE_MAX, s)); }

// Debounced write of the views map — saveView() can fire many times per
// gesture (every wheel tick), so coalesce the localStorage writes.
let persistTimer = null;
function persistViews() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    try { localStorage.setItem(MAP_VIEWS_KEY, JSON.stringify(views)); } catch {}
  }, 200);
}

function saveView() {
  if (!viewFile) return;
  views[viewFile] = { ...view };
  persistViews();
}

// Center the whole image in the viewport at the largest scale that fits.
function fitMap() {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const vw = vp.clientWidth, vh = vp.clientHeight;
  if (!iw || !ih || !vw || !vh) return;
  const scale = Math.min(vw / iw, vh / ih) || 1;
  view = { scale, tx: (vw - iw * scale) / 2, ty: (vh - ih * scale) / 2 };
  saveView();
  applyTransform();
}

function loadMap(idx) {
  if (!maps.length) return;
  saveView();  // persist the outgoing map's view before switching
  mapIdx = (idx % maps.length + maps.length) % maps.length;
  localStorage.setItem(MAP_IDX_KEY, String(mapIdx));
  const f = maps[mapIdx];
  viewFile = f;
  $("map-label").textContent = f;
  $("map-label").title = f;
  $("map-counter").textContent = `${mapIdx + 1} / ${maps.length}`;
  // The load handler restores a saved view (if any) or fits to the viewport.
  img.src = "/maps/" + encodeURIComponent(f);
}

img.addEventListener("load", () => {
  const saved = views[viewFile];
  if (saved) { view = { ...saved }; applyTransform(); }
  else fitMap();
});

// Zoom by `factor` while keeping the viewport-relative point (cx, cy) fixed
// on screen. Shared by the wheel, the +/− buttons, and pinch gestures.
function zoomAt(cx, cy, factor) {
  if (!maps.length) return;
  const ns = clampScale(view.scale * factor);
  const k = ns / view.scale;
  view.tx = cx - (cx - view.tx) * k;
  view.ty = cy - (cy - view.ty) * k;
  view.scale = ns;
  saveView();
  applyTransform();
}

// Mouse wheel zooms toward the cursor.
vp.addEventListener("wheel", e => {
  if (!maps.length) return;
  e.preventDefault();
  const rect = vp.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.15 : 1 / 1.15);
}, { passive: false });

// Pan by dragging with the mouse.
let panning = false, panStart = null;
vp.addEventListener("mousedown", e => {
  if (!maps.length || e.button !== 0) return;
  panning = true;
  vp.classList.add("panning");
  panStart = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty };
  e.preventDefault();
});
window.addEventListener("mousemove", e => {
  if (!panning) return;
  view.tx = panStart.tx + (e.clientX - panStart.x);
  view.ty = panStart.ty + (e.clientY - panStart.y);
  applyTransform();
});
window.addEventListener("mouseup", () => {
  if (panning) { panning = false; vp.classList.remove("panning"); saveView(); }
});

// Touch: one finger pans, two fingers pinch-zoom (and pan via the midpoint).
// #map-viewport has `touch-action: none` so the browser doesn't also scroll
// or page-zoom while we drive the transform ourselves.
let touch = null;  // { mode, ... } gesture state
function touchPt(t) {
  const rect = vp.getBoundingClientRect();
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}
function beginTouch(touches) {
  if (touches.length === 1) {
    const p = touchPt(touches[0]);
    touch = { mode: "pan", x: p.x, y: p.y, tx: view.tx, ty: view.ty };
  } else if (touches.length >= 2) {
    const a = touchPt(touches[0]), b = touchPt(touches[1]);
    touch = {
      mode: "pinch",
      dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
      midX: (a.x + b.x) / 2, midY: (a.y + b.y) / 2,
      scale: view.scale, tx: view.tx, ty: view.ty,
    };
  }
}
vp.addEventListener("touchstart", e => {
  if (!maps.length) return;
  beginTouch(e.touches);     // re-anchors when a second finger joins
  e.preventDefault();
}, { passive: false });
vp.addEventListener("touchmove", e => {
  if (!touch || !maps.length) return;
  e.preventDefault();
  if (touch.mode === "pan" && e.touches.length >= 1) {
    const p = touchPt(e.touches[0]);
    view.tx = touch.tx + (p.x - touch.x);
    view.ty = touch.ty + (p.y - touch.y);
    applyTransform();
  } else if (touch.mode === "pinch" && e.touches.length >= 2) {
    const a = touchPt(e.touches[0]), b = touchPt(e.touches[1]);
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const midX = (a.x + b.x) / 2, midY = (a.y + b.y) / 2;
    const ns = clampScale(touch.scale * (dist / touch.dist));
    const k = ns / touch.scale;
    // Anchor the gesture's start midpoint to the current midpoint: this both
    // zooms about that point and pans as the fingers slide together.
    view.tx = midX - (touch.midX - touch.tx) * k;
    view.ty = midY - (touch.midY - touch.ty) * k;
    view.scale = ns;
    applyTransform();
  }
}, { passive: false });
function endTouch(e) {
  if (!touch) return;
  if (e.touches.length === 0) { touch = null; saveView(); }
  else { saveView(); beginTouch(e.touches); }  // re-anchor remaining finger(s)
}
vp.addEventListener("touchend", endTouch);
vp.addEventListener("touchcancel", endTouch);

$("map-prev").addEventListener("click", () => loadMap(mapIdx - 1));
$("map-next").addEventListener("click", () => loadMap(mapIdx + 1));
$("map-fit").addEventListener("click", fitMap);
$("map-zoom-in").addEventListener("click", () => zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 1.3));
$("map-zoom-out").addEventListener("click", () => zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 1 / 1.3));

// Horizontal splitter — drag to allocate height between top pane and map.
function applyMapHeight(px) {
  const minH = 80;
  const maxH = Math.max(minH, window.innerHeight - 220);
  const clamped = Math.max(minH, Math.min(maxH, Math.round(px)));
  document.documentElement.style.setProperty("--map-height", `${clamped}px`);
  localStorage.setItem(MAP_H_KEY, String(clamped));
}
applyMapHeight(Number(localStorage.getItem(MAP_H_KEY)) || 320);

let vdragging = false;
$("hsplitter").addEventListener("mousedown", e => {
  vdragging = true;
  document.body.classList.add("vresizing");
  e.preventDefault();
});
window.addEventListener("mousemove", e => {
  if (!vdragging) return;
  // Map height = distance from cursor to the bottom edge of #main.
  const rect = $("main").getBoundingClientRect();
  applyMapHeight(rect.bottom - e.clientY);
});
window.addEventListener("mouseup", () => {
  if (vdragging) { vdragging = false; document.body.classList.remove("vresizing"); }
});
window.addEventListener("resize", () =>
  applyMapHeight(Number(localStorage.getItem(MAP_H_KEY)) || 320));

async function initMaps() {
  try {
    const r = await fetch("/api/maps");
    maps = r.ok ? await r.json() : [];
  } catch { maps = []; }
  if (!maps.length) {
    $("map-pane").classList.add("empty");
    ["map-prev", "map-next", "map-fit", "map-zoom-in", "map-zoom-out"]
      .forEach(id => { $(id).disabled = true; });
    $("map-label").textContent = "";
    $("map-counter").textContent = "";
    return;
  }
  let start = Number(localStorage.getItem(MAP_IDX_KEY)) || 0;
  if (!(start >= 0 && start < maps.length)) start = 0;
  loadMap(start);
}

// Flush any pending debounced write synchronously when the page goes away, so
// a quick refresh inside the 200ms window doesn't lose the latest pan/zoom.
